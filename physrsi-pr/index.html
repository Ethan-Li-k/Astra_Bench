<style>
:root { --bg:#f6f8fa; --surface:#fff; --fg:#16212b; --muted:#5a6875; --rule:#d9e1e8; --teal:#13738f; --code:#eef2f5; }
@media (prefers-color-scheme: dark) { :root { --bg:#0f161c; --surface:#16202a; --fg:#e3eaf0; --muted:#96a5b2; --rule:#2a3946; --teal:#4fb3cf; --code:#1c2833; color-scheme: dark; } }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
html { overflow-x: hidden; }
body { background: var(--bg); color: var(--fg); font: 16px/1.85 "Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif; display: flex; flex-direction: column; }
header { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--rule);
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px max(16px, 3vw); }
header .name { font-weight: 700; margin-right: auto; }
header button { font: inherit; font-size: 14px; color: var(--fg); background: transparent; border: 1px solid var(--rule); border-radius: 6px; padding: 4px 12px; cursor: pointer; }
header button[aria-pressed="true"] { background: var(--teal); border-color: var(--teal); color: #fff; }
header button:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
main { flex: 1; min-height: 0; }
.view { height: 100%; }
/* Markdown view: GitHub's own markdown stylesheet (github-markdown-css 5.8.1), same column width as github.com,
   so image width attributes (width="90%" etc.) render exactly as on GitHub. No overrides on images. */
#md { box-sizing: border-box; max-width: 980px; margin: 0 auto; padding: 32px 45px 80px; }
@media (max-width: 767px) { #md { padding: 16px; } }
#src { background: var(--code); border-radius: 8px; padding: 14px; overflow-x: auto; font: 13px/1.6 ui-monospace, Menlo, monospace; }
#src-wrap { max-width: 980px; margin: 0 auto; padding: 24px max(16px, 3vw) 60px; }
#src { white-space: pre-wrap; word-break: break-word; margin: 0; }
iframe { border: 0; width: 100%; height: 100%; display: block; background: var(--bg); }
</style>

<script>
(function () {
  var mdText = '';
  var tabs = { art: 'view-art', md: 'view-md', src: 'view-src' };
  function show(key) {
    Object.keys(tabs).forEach(function (k) {
      document.getElementById(tabs[k]).hidden = k !== key;
      document.getElementById('tab-' + k).setAttribute('aria-pressed', String(k === key));
    });
    if (key === 'art') {
      var f = document.querySelector('iframe');
      // 按当前地址推算 article.html，兼容 htmlpreview 这类把真实地址放在查询串里的预览服务
      var here = location.href.split('#')[0];
      if (!f.src) f.src = /index\.html$/.test(here) ? here.replace(/index\.html$/, f.dataset.src) : f.dataset.src;
    }
    try { history.replaceState(null, '', '#' + key); } catch (e) {}
  }
  Object.keys(tabs).forEach(function (k) {
    document.getElementById('tab-' + k).addEventListener('click', function () { show(k); });
  });
  document.getElementById('copy').addEventListener('click', function () {
    var btn = this;
    function done(m) { btn.textContent = m; setTimeout(function () { btn.textContent = '复制 Markdown'; }, 2000); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(mdText).then(function () { done('已复制'); }, function () { show('src'); done('请在源码页手动复制'); });
    } else { show('src'); done('请在源码页手动复制'); }
  });
  (function (t, base) {
    mdText = t;
    document.getElementById('src').textContent = t;
    var md = document.getElementById('md');
    md.innerHTML = marked.parse(t);
    md.querySelectorAll('[src], [href]').forEach(function (el) {
      ['src', 'href'].forEach(function (a) {
        var v = el.getAttribute(a);
        if (v && /^(img|anim|media)\//.test(v)) el.setAttribute(a, base + v);

  })("# PhysRSI-Eval \u63ed\u793a VLM-as-Policy \u81ea\u6211\u6539\u8fdb\u7684\u201c\u6876\u677f\u6548\u5e94\u201d\uff1aCoding \u80fd\u529b\u5e76\u975e\u6700\u91cd\u8981\n\n> \u8ba9\u5927\u6a21\u578b\u76f4\u63a5\u63a7\u5236\u673a\u5668\u4eba\uff0c\u5e76\u5728 17 \u8f6e\u8bd5\u9519\u4e2d\u81ea\u5df1\u6539\u4ee3\u7801\u3001\u5199\u5de5\u5177\u3001\u8bb0\u7b14\u8bb0\u3002\u80fd\u5f00\u597d\u5c40\u9760\u7a7a\u95f4\u63a8\u7406\uff0c\u80fd\u4ece\u5931\u8d25\u4e2d\u722c\u8d77\u6765\u9760\u611f\u77e5\uff1b\u7f16\u7a0b\u80fd\u529b\u4e0e\u5f00\u5c40\u3001\u6548\u7387\u3001\u9884\u7b97\u4e09\u4e2a\u7ef4\u5ea6\u7684\u76f8\u5173\u6700\u5f31\u3002\n\n**Where is Physical RSI capability from? An Observational Scaling Law of LLM-as-policy**\nZekai Li\\*, Jiayi Yu\\*, Jinlu Zhang\\*, Luyang Niu\\*, Zekun Qi\\*, Jun Zheng, Xuchuan Chen, Dairu Liu, Yintianrun Zhang, He Wang\u2020, Li Yi\u2020 \u00b7 Galbot Team\uff08\\* \u5171\u540c\u7b2c\u4e00\u4f5c\u8005\u3000\u2020 \u901a\u8baf\u4f5c\u8005\uff09\n\n\u8bba\u6587 https://arxiv.org/abs/2610.26848 \uff5c \u4e3b\u9875 https://physrsi-eval.github.io/ \uff5c \u4ee3\u7801 https://github.com/PhysRSI-Eval/PhysRSI-Eval-code\n\n\u003cp align=\"center\">\u003cimg src=\"anim/climb.gif\" width=\"100%\" alt=\"\u516d\u4e2a\u7cfb\u7edf K1 \u5230 K17 \u9010\u8f6e\u6700\u597d\u5747\u5206\u7684\u722c\u5347\u52a8\u753b\">\u003c/p>\n\n*17 \u8f6e\u81ea\u6211\u6539\u8fdb\uff0c\u9010\u8f6e\u56de\u653e\u3002\u5b9e\u7ebf\u4e3a\u5230\u7b2c k \u8f6e\u4e3a\u6b62\u7684\u6700\u597d\u5747\u5206\uff0c\u5706\u5708\u4e3a\u534a\u7a0b\u589e\u76ca\u8f6e\u6b21 T50\u3002`\u8bba\u6587 \u56fe 7`*\n\n\u003cp align=\"center\">\u003cimg src=\"anim/radar.gif\" width=\"100%\" alt=\"\u4e03\u4e2a\u7cfb\u7edf\u4e94\u7ef4\u753b\u50cf\u7684\u52a8\u753b\">\u003c/p>\n\n*\u4e03\u4e2a\u7cfb\u7edf\u7684\u4e94\u7ef4\u753b\u50cf\uff1a\u5148\u9010\u4e2a\u7ed8\u5236\uff0c\u518d\u53e0\u52a0\u5bf9\u6bd4\u3002`\u8bba\u6587 \u56fe 5 \u00b7 \u8868 1`*\n\n## \u56db\u4e2a\u53d1\u73b0\n\n| | \u53d1\u73
