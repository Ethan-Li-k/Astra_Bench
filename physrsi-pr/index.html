<!doctype html>
<!-- PhysRSI-Eval 中文宣传稿预览：Markdown 渲染 / Markdown 源码 / 排版稿（article.html）三种视图 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PhysRSI-Eval 宣传稿预览</title>
<style>
:root { --bg:#f6f8fa; --surface:#fff; --fg:#16212b; --muted:#5a6875; --rule:#d9e1e8; --teal:#13738f; --code:#eef2f5; }
@media (prefers-color-scheme: dark) { :root { --bg:#0f161c; --surface:#16202a; --fg:#e3eaf0; --muted:#96a5b2; --rule:#2a3946; --teal:#4fb3cf; --code:#1c2833; color-scheme: dark; } }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--fg); font: 16px/1.85 "Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif; display: flex; flex-direction: column; }
header { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--rule);
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px max(16px, 3vw); }
header .name { font-weight: 700; margin-right: auto; }
header button { font: inherit; font-size: 14px; color: var(--fg); background: transparent; border: 1px solid var(--rule); border-radius: 6px; padding: 4px 12px; cursor: pointer; }
header button[aria-pressed="true"] { background: var(--teal); border-color: var(--teal); color: #fff; }
header button:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
main { flex: 1; min-height: 0; }
.view { height: 100%; }
#md { max-width: 780px; margin: 0 auto; padding: 32px max(16px, 3vw) 80px; }
#md img { display: block; max-width: 100%; height: auto; background: #fff; border: 1px solid var(--rule); border-radius: 8px; padding: 10px; margin: 8px 0; }
#md h1 { font-size: 30px; line-height: 1.35; }
#md h2 { font-size: 24px; border-bottom: 1px solid var(--rule); padding-bottom: 4px; margin-top: 40px; }
#md h3 { font-size: 18px; }
#md blockquote { margin: 0; padding: 4px 16px; border-left: 3px solid var(--teal); color: var(--muted); }
#md em { color: var(--muted); font-size: 14px; }
#md table { border-collapse: collapse; display: block; overflow-x: auto; font-size: 14px; font-variant-numeric: tabular-nums; }
#md th, #md td { border: 1px solid var(--rule); padding: 6px 10px; }
#md pre, #src { background: var(--code); border-radius: 8px; padding: 14px; overflow-x: auto; font: 13px/1.6 ui-monospace, Menlo, monospace; }
#md a { color: var(--teal); overflow-wrap: anywhere; }
#src-wrap { max-width: 980px; margin: 0 auto; padding: 24px max(16px, 3vw) 60px; }
#src { white-space: pre-wrap; word-break: break-word; margin: 0; }
iframe { border: 0; width: 100%; height: 100%; display: block; background: var(--bg); }
</style>
</head>
<body>
<header>
  <span class="name">PhysRSI-Eval 宣传稿</span>
  <button type="button" id="tab-md" aria-pressed="true">Markdown 渲染</button>
  <button type="button" id="tab-src" aria-pressed="false">Markdown 源码</button>
  <button type="button" id="tab-art" aria-pressed="false">排版稿</button>
  <button type="button" id="copy">复制 Markdown</button>
</header>
<main>
  <div class="view" id="view-md"><article id="md">加载中…</article></div>
  <div class="view" id="view-src" hidden><div id="src-wrap"><pre id="src"></pre></div></div>
  <div class="view" id="view-art" hidden><iframe title="排版稿" data-src="article.html"></iframe></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
(function () {
  var mdText = '';
  var tabs = { md: 'view-md', src: 'view-src', art: 'view-art' };
  function show(key) {
    Object.keys(tabs).forEach(function (k) {
      document.getElementById(tabs[k]).hidden = k !== key;
      document.getElementById('tab-' + k).setAttribute('aria-pressed', String(k === key));
    });
    if (key === 'art') {
      var f = document.querySelector('iframe');
      if (!f.src) f.src = f.dataset.src;
    }
    try { location.hash = key; } catch (e) {}
  }
  Object.keys(tabs).forEach(function (k) {
    document.getElementById('tab-' + k).addEventListener('click', function () { show(k); });
  });
  document.getElementById('copy').addEventListener('click', function () {
    var btn = this;
    function done(m) { btn.textContent = m; setTimeout(function () { btn.textContent = '复制 Markdown'; }, 2000); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(mdText).then(function () { done('已复制'); }, function () { show('src'); done('请在源码页手动复制'); });
    } else { show('src'); done('请在源码页手动复制'); }
  });
  fetch('PR.md', { cache: 'no-store' }).then(function (r) { return r.text(); }).then(function (t) {
    mdText = t;
    document.getElementById('src').textContent = t;
    var md = document.getElementById('md');
    if (window.marked) { md.innerHTML = marked.parse(t); }
    else { md.innerHTML = '<p>Markdown 渲染库未加载，请查看“Markdown 源码”。</p>'; }
  }).catch(function (e) {
    document.getElementById('md').textContent = '读取 PR.md 失败：' + e;
  });
  var initial = (location.hash || '').slice(1);
  show(tabs[initial] ? initial : 'md');
})();
</script>
</body>
</html>
